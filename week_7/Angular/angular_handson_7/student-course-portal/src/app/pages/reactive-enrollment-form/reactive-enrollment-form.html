<h2>Reactive Enrollment Form</h2>

<form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">

  <!-- Student Name -->
  <div>

    <label>Student Name</label>

    <input
      type="text"
      formControlName="studentName">

    <div *ngIf="enrollForm.get('studentName')?.touched">

      <small *ngIf="enrollForm.get('studentName')?.errors?.['required']">
        Name is required.
      </small>

      <small *ngIf="enrollForm.get('studentName')?.errors?.['minlength']">
        Minimum 3 characters required.
      </small>

    </div>

  </div>

  <br>

  <!-- Email -->
  <div>

    <label>Student Email</label>

    <input
      type="email"
      formControlName="studentEmail">

    <div *ngIf="enrollForm.get('studentEmail')?.pending">
      Checking email...
    </div>

    <div *ngIf="enrollForm.get('studentEmail')?.touched">

      <small *ngIf="enrollForm.get('studentEmail')?.errors?.['required']">
        Email is required.
      </small>

      <small *ngIf="enrollForm.get('studentEmail')?.errors?.['email']">
        Enter a valid email.
      </small>

      <small *ngIf="enrollForm.get('studentEmail')?.errors?.['emailTaken']">
        Email already taken.
      </small>

    </div>

  </div>

  <br>

  <!-- Course ID -->
  <div>

    <label>Course ID</label>

    <input
      type="text"
      formControlName="courseId">

    <div *ngIf="enrollForm.get('courseId')?.touched">

      <small *ngIf="enrollForm.get('courseId')?.errors?.['required']">
        Course ID is required.
      </small>

      <small *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']">
        Course code starting with XX is not allowed.
      </small>

    </div>

  </div>

  <br>

  <!-- Semester -->
  <div>

    <label>Preferred Semester</label>

    <select formControlName="preferredSemester">
      <option value="Odd">Odd</option>
      <option value="Even">Even</option>
    </select>

  </div>

  <br>

  <!-- Terms -->
  <div>

    <label>

      <input
        type="checkbox"
        formControlName="agreeToTerms">

      Agree to Terms

    </label>

    <div *ngIf="enrollForm.get('agreeToTerms')?.touched">

      <small *ngIf="enrollForm.get('agreeToTerms')?.errors?.['required']">
        This field is required.
      </small>

      <small *ngIf="enrollForm.get('agreeToTerms')?.errors?.['requiredTrue']">
        Please accept the terms.
      </small>

    </div>

  </div>

  <br>

  <!-- Additional Courses -->

  <h3>Additional Courses</h3>

  <div formArrayName="additionalCourses">

    <div
      *ngFor="let ctrl of additionalCourses.controls; let i = index">

      <input [formControl]="$any(ctrl)">

      <button
        type="button"
        (click)="removeCourse(i)">
        Remove
      </button>

      <br><br>

    </div>

  </div>

  <button
    type="button"
    (click)="addCourse()">

    Add Another Course

  </button>

  <br><br>

  <button
    type="submit"
    [disabled]="enrollForm.invalid">

    Submit

  </button>

</form>
