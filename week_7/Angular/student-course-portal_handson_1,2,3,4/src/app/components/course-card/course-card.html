<div
  [ngClass]="cardClasses"
  [ngStyle]="{
    'border-left':
      course.gradeStatus === 'passed'
        ? '6px solid green'
        : course.gradeStatus === 'failed'
        ? '6px solid red'
        : '6px solid gray'
  }">

  <h3>{{course.name}}</h3>

  <p>{{course.code}}</p>

  <p>{{course.credits}}</p>

  <div [ngSwitch]="course.gradeStatus">

    <p *ngSwitchCase="'passed'" style="color:green">
      Passed
    </p>

    <p *ngSwitchCase="'failed'" style="color:red">
      Failed
    </p>

    <p *ngSwitchDefault style="color:gray">
      Pending
    </p>

  </div>

  <button (click)="toggleDetails()">
    Show Details
  </button>

  <button (click)="enrollRequested.emit(course.id)">
    Enroll
  </button>

</div>
