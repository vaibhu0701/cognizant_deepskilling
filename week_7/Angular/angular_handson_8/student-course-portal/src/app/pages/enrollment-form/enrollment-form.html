<h1>Enrollment Request Form</h1>

<form #enrollForm="ngForm"
      (ngSubmit)="onSubmit(enrollForm)">

    <!-- Name -->

    <label>Name</label>

    <input
        type="text"
        name="studentName"
        [(ngModel)]="studentName"
        required
        minlength="3"
        #nameCtrl="ngModel">

    <div *ngIf="nameCtrl.touched">

        <span *ngIf="nameCtrl.errors?.['required']">

            Name is required

        </span>

        <span *ngIf="nameCtrl.errors?.['minlength']">

            Name must be at least 3 characters

        </span>

    </div>

    <br><br>

    <!-- Email -->

    <label>Email</label>

    <input
        type="email"
        name="studentEmail"
        [(ngModel)]="studentEmail"
        required
        email
        #emailCtrl="ngModel">

    <div *ngIf="emailCtrl.touched">

        <span *ngIf="emailCtrl.errors?.['required']">

            Email is required

        </span>

        <span *ngIf="emailCtrl.errors?.['email']">

            Invalid Email

        </span>

    </div>

    <br><br>

    <!-- Course ID -->

    <label>Course ID</label>

    <input
        type="number"
        name="courseId"
        [(ngModel)]="courseId"
        required
        #courseCtrl="ngModel">

    <div *ngIf="courseCtrl.touched">

        <span *ngIf="courseCtrl.errors?.['required']">

            Course ID is required

        </span>

    </div>

    <br><br>

    <!-- Semester -->

    <label>Semester</label>

    <select
        name="preferredSemester"
        [(ngModel)]="preferredSemester"
        required>

        <option value="">Select</option>

        <option value="Odd">Odd</option>

        <option value="Even">Even</option>

    </select>

    <br><br>

    <!-- Checkbox -->

    <input
        type="checkbox"
        name="agreeToTerms"
        [(ngModel)]="agreeToTerms"
        required
        #agreeCtrl="ngModel">

    I Agree to Terms

    <div *ngIf="agreeCtrl.touched">

        <span *ngIf="agreeCtrl.errors?.['required']">

            Please accept terms

        </span>

    </div>

    <br><br>

    <button
        type="submit"
        [disabled]="enrollForm.invalid">

        Submit

    </button>

    <button
        type="button"
        (click)="enrollForm.resetForm()">

        Reset

    </button>

</form>

<div
    class="success"
    *ngIf="submitted">

    Enrollment request submitted successfully!

</div>
