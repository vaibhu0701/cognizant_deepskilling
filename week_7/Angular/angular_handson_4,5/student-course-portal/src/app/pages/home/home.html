<h1>{{ portalName }}</h1>

<p>
    Manage your courses, monitor your progress, and view your student profile.
</p>

<button
    [disabled]="!isPortalActive"
    (click)="onEnrollClick()">
    Enroll Now
</button>

<p>{{ message }}</p>

<br>

<input
    type="text"
    placeholder="Search course"
    [(ngModel)]="searchTerm">

<p>Searching for: {{ searchTerm }}</p>

<!--
[property]  -> One-way binding (Component → DOM)

[(ngModel)] -> Two-way binding (Component ↔ DOM)
-->

<div class="stats">

    <div class="card">
        <h3>Courses Available</h3>
        <p>{{ coursesAvailable }}</p>
    </div>

    <div class="card">
        <h3>Enrolled</h3>
        <p>3</p>
    </div>

    <div class="card">
        <h3>GPA</h3>
        <p>3.8</p>
    </div>

</div>
